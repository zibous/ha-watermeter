## -----------------------------------------------------------------------------------------------------
##  ATOM LITE  S3  GRAY (ESP32)
##  ESP32S3FN8
##  Chip is ESP32-PICO-D4 (revision 1)
##  Crystal is 40MHz
##  Flash: 4096kB
##  Mode:DIO
##  Chip: ESP32 Features:EMB_FLASH,WIFI_BGN,BLE,BT, Cores:2
##  Revision:1
##  ESP-IDF: v4.4.2
##  Features: WiFi, BT, Dual Core, 240MHz, Embedded Flash,
##            VRef calibration in efuse, Coding Scheme None
##
##  RAM:   [=         ]  13.3% (used 43632 bytes from 327680 bytes)
##  Flash: [======    ]  59.8% (used 1097633 bytes from 1835008 bytes)
##
##  HAkey: inH49O9jBeK5yTGb1X2g4WV/1aS6YKUpu3Vu277fDgw=
##
##  Wasserzähler 2024: 24058612  --> 0x24058612 !!
##
## -----------------------------------------------------------------------------------------------------
substitutions:
  ## device settings
  hostname: "atom-watermeter"
  dashbordtitle: "ATOM-LITE - Wasserzähler 2024"
  friendly_name: "Wasseruhr"
  device_description: "Production 2024: Wasserzähler ESP32-PICO-D4 + EBYTE TI CC1101 für IZAR module Diehl IZAR RC 868 I R4 PL"

  # The format of the name should be author_name.project_name.
  projectname: "Peter Siebler.${hostname}"
  appversion: "1.2.0"
  hardware: "ATOM-LITE ESP32S3FN8"
  location: "Heizraum"
  watermeter_installed: "2024-03-01 14:00:00"

  ## logger settings
  log_level: "DEBUG" # not that logging need memory, so in production mode use "WARN"
  log_baudrate: "115200" # use 0 to disable serial UART port logging.

  hakey: "inH49O9jBeK5yTGb1X2g4WV/1aS6YKUpu3Vu277fDgw="

  ## ----------------
  ## used device pins
  ## ----------------
  # led_internal: 27
  # big_button:   39

  ## ----------------
  ## used device pins
  ## ----------------
  # EBYTE TI CC1101:
  # cs_pin:       22
  # clk_pin:      23
  # mosi_pin:     19
  # miso_pin:     33
  # gdo0_pin:     26
  # gdo2_pin:     32

## ----------------------------------------------------------------
## Board ATOM LITE
## ----------------------------------------------------------------
esp32:
  board: m5stack-atom
  framework:
    type: esp-idf
  flash_size: 4MB
  watchdog_timeout: 5s

## ----------------------------------------------------------------
## Customize the frequency in which data is flushed to the flash.
## ----------------------------------------------------------------
preferences:
  flash_write_interval: 10min

## ----------------------------------------------------------------
## APPLICATION ESPHOME
## ----------------------------------------------------------------
esphome:
  name: ${hostname}
  friendly_name: ${dashbordtitle}
  build_path: ./build/${hostname}
  comment: ${device_description}
  on_boot:
    then:
      - globals.set:
          id: boot_counter
          value: !lambda "return id(boot_counter)+=1;"
      - logger.log:
          level: WARN
          tag: "system"
          format: "BOOTMESSAGE:${hostname} API is connected, Device ready!"
      - component.update: bootcounter
      - light.turn_on:
          id: internal_led
          brightness: 20%
          color_mode: RGB
          green: 100%
  on_shutdown:
    then:
      - logger.log:
          level: ERROR
          tag: "system"
          format: "BOOTMESSAGE:${hostname} is down!"
  project:
    # This allows creators to add the project name and version to the compiled code.
    # It is currently only exposed via the logger, mDNS and the device_info response
    # via the native API. The format of the name should be author_name.project_name.
    name: ${projectname}
    version: ${appversion}
  area: ${location}
  name_add_mac_suffix: false
  # minimum version of ESPHome required to compile.
  min_version: 2026.6.4

## ------------------------------------------------------------------
## EXTERNAL COMPONENTS
## https://esphome.io/components/external_components.html
## ------------------------------------------------------------------
external_components:
  - source: github://SzczepanLeon/esphome-components@main
    components: [ wmbus_radio, wmbus_common, wmbus_meter ]

## ------------------------------------------------------------------
## Global variables
## https://esphome.io/components/globals.html
## ------------------------------------------------------------------
globals:
  - id: boot_counter
    type: int
    restore_value: yes
    initial_value: "0"

  - id: last_value
    type: float
    restore_value: yes
    initial_value: "0.00"

  - id: current_value
    type: float
    restore_value: yes
    initial_value: "0.00"

  - id: hour_value
    type: float
    restore_value: yes
    initial_value: "0.00"

  - id: daily_value
    type: float
    restore_value: yes
    initial_value: "0.00"

  - id: yesterday_value
    type: float
    restore_value: yes
    initial_value: "0.00"

  - id: week_value
    type: float
    restore_value: yes
    initial_value: "0.00"

  - id: month_value
    type: float
    restore_value: yes
    initial_value: '0.0'

  - id: lastmonth_value
    type: float
    restore_value: yes
    initial_value: "0.00"

  - id: year_value
    type: float
    restore_value: yes
    initial_value: "0.00"

  - id: send_millisecond
    type: int
    restore_value: no
    initial_value: "0"

  - id: cc1101_state
    type: int
    restore_value: no
    initial_value: "0"

  - id: cc1101_state_message
    type: std::vector<std::string>
    restore_value: no
    # initial_value: '{"Init", "Waiting", "Recived Data", "Ready", "Error"}'
    initial_value: '{"Init", "Warte auf Daten", "Daten empfangen", "Ready", "Error"}'

## ------------------------------------------------------------------
## COMPONENT LOGGER
## https://esphome.io/components/logger.html
## ------------------------------------------------------------------
logger:
  level: DEBUG
  logs:
    wmbusmeters: INFO
    cc1101: ERROR

## ------------------------------------------------------------------
## COMPONENT WIFI
## https://esphome.io/components/wifi.html
## ------------------------------------------------------------------
wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_pswd
      priority: 100
      id: iot
    - ssid: !secret ssid2_name
      password: !secret ssid2_pswd
      priority: 50
      id: waple
    - ssid: !secret ssid3_name
      password: !secret ssid3_pswd
      priority: 30
      id: wapl2
  domain: !secret domain
  reboot_timeout: 5min
  enable_on_boot: true
  power_save_mode: NONE
  ap:
    ssid: ${hostname}_AP
    password: !secret hotspot_pswd

